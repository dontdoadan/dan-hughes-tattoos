<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>Daniel Hughes Tattoos</title>
  <style>
    :root { color-scheme: light; }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background: #fff;
      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    a:focus-visible { outline: 2px solid #171717; outline-offset: 5px; }
    .container {
      width: min(1200px, calc(100% - 48px));
      margin-inline: auto;
    }
    .site-header { border-bottom: 1px solid #eaeaea; }
    .site-header .container { min-height: 76px; display: flex; align-items: center; }
    .brand { font-size: 14px; font-weight: 600; letter-spacing: .01em; text-decoration: none; }
    main { flex: 1; width: 100%; }
    .site-footer { border-top: 1px solid #eaeaea; }
    .site-footer .container {
      min-height: 64px;
      display: flex;
      align-items: center;
      color: #737373;
      font-size: 11px;
    }
    @media (max-width: 600px) {
      .container { width: calc(100% - 36px); }
      .site-header .container { min-height: 64px; }
      .site-footer .container { min-height: 56px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/">Daniel Hughes Tattoos</a>
    </div>
  </header>

  <main id="main" aria-label="Website content">
    <!-- Blank canvas: build future sections here. -->
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© 2026 Daniel Hughes Tattoos</span>
    </div>
  </footer>
</body>
</html>
