<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Daniel Hughes — custom black & grey realism tattoo artist and private tattoo studio.">
  <meta name="robots" content="noindex, nofollow">
  <title>Daniel Hughes — Custom Black & Grey Realism</title>
  <style>
    :root { color-scheme: dark; --bg:#090909; --fg:#f1f1ef; --muted:#969692; --line:rgba(255,255,255,.14); }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body { min-height:100vh; background:radial-gradient(circle at 50% 35%, #191919 0, var(--bg) 48%); color:var(--fg); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { min-height:100vh; display:grid; place-items:center; padding:32px; }
    .shell { width:min(760px,100%); text-align:center; }
    .eyebrow { margin:0 0 28px; font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--muted); }
    h1 { margin:0; font-family:Georgia, "Times New Roman", serif; font-size:clamp(52px,10vw,112px); line-height:.9; font-weight:400; letter-spacing:-.055em; }
    .descriptor { margin:28px 0 0; font-size:clamp(16px,2vw,20px); letter-spacing:.03em; }
    .copy { max-width:520px; margin:18px auto 0; color:var(--muted); font-size:15px; line-height:1.7; }
    .status { display:inline-flex; margin-top:40px; padding:12px 18px; border:1px solid var(--line); border-radius:999px; font-size:10px; letter-spacing:.2em; text-transform:uppercase; }
    footer { position:fixed; inset:auto 0 24px; text-align:center; color:#666; font-size:11px; letter-spacing:.08em; }
    @media (max-width:600px) { main { padding:24px; } h1 { font-size:58px; } footer { bottom:18px; } }
  </style>
</head>
<body>
  <main>
    <section class="shell" aria-labelledby="title">
      <p class="eyebrow">Private Tattoo Studio</p>
      <h1 id="title">Daniel Hughes</h1>
      <p class="descriptor">Custom Black &amp; Grey Realism</p>
      <p class="copy">Bespoke large-scale tattoo work, designed around the individual and the body.</p>
      <div class="status">Coming Soon</div>
      <p class="copy">Custom tattoo enquiries will reopen shortly.</p>
    </section>
  </main>
  <footer>© Daniel Hughes</footer>
  <!-- GitHub → Vercel connection test -->
</body>
</html>
